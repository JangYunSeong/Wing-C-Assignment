[project]
name = "task-spec"
version = "0.1.0"
description = "P1: 이력서·자기소개서 + 공고 + 온톨로지 → 과제 명세 (FastAPI + LangGraph)"
authors = [
    { name = "JangYunSeong", email = "46878756+JangYunSeong@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.24.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "kiwipiepy>=0.24.1",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "pg: task_db_test(PostgreSQL) 가 필요한 통합 테스트 — TEST_DATABASE_URL 필요",
    "llm: 실제 외부 LLM API 호출 (비용 발생) — 명시적으로 -m llm 일 때만",
    "podman: 실제 podman 으로 자식 컨테이너를 띄우는 격리 확인 (#127) — 명시적으로 -m podman 일 때만",
]
addopts = "-m 'not pg and not llm and not podman'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]  # 줄 길이는 ruff format 이 맞춘다 (한글 docstring 폭 오탐)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]  # 테스트의 픽스처 파일 조작은 블로킹이어도 무방
"eval/**" = ["ASYNC240"]
