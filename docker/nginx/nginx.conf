# task-api 앞단 리버스 프록시 — TLS + Basic 인증 (deployment 스킬 "nginx")
#
# 앱에 인증이 없다 (api/routers/runs.py TODO(auth)) → 인터넷에 노출될 때 이 Basic 인증이 유일한 문.
# 마운트 (docker/nginx/run.sh):
#   /etc/nginx/certs/fullchain.pem, privkey.pem   TLS 인증서
#   /etc/nginx/auth/htpasswd                       Basic 인증 계정 (htpasswd -B)
#   /etc/nginx/conf.d/allow.conf                   (선택) IP 허용 목록 — 'allow x.x.x.x/nn;' 줄 + 마지막 'deny all;'
#   /var/www/acme                                  certbot --webroot 경로 (80 의 확인 경로만)
#   /etc/nginx/conf.d/upstream.conf                upstream task_api 블록 (run.sh 가 생성)
# 네트워크: 기본은 호스트 네트워크 — rootless podman 의 포트 전달(rootlessport)은 접속자 IP 를 내부 주소로 바꿔
#   IP 별 요청 제한·허용 목록이 동작하지 않는다. 호스트 네트워크면 nginx 가 접속을 직접 받아 실제 IP 를 본다.

worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 접근 로그에 요청 본문·쿼리를 남기지 않는다 (지원서 업로드 경로 — 원문 금지)
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log main;

    # 업로드 상한: 앱 UPLOAD_MAX_BYTES(10 MiB) × 문서 2개 + 여유
    client_max_body_size 25m;
    # 업로드 본문을 받는 동안 두 번 읽는 사이 대기 시간 (기본 60s) — 느린 회선에서 스캔본 이력서를 올리면 끊겼다
    # (2026-11-12 POST /runs 408, 64.6초). 본문을 다 받기 전에는 앱으로 넘기지 않으므로 앱 로그에는 남지 않는다
    client_body_timeout 300s;

    # 요청 속도 제한 (IP 당)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # upstream task_api { ... } — run.sh 가 네트워크 방식에 맞춰 만든다
    #   host(기본): 127.0.0.1:8001 (task-api 의 로컬 포트) / bridge: task-net 의 task-api:8000
    include /etc/nginx/conf.d/upstream.conf;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt 갱신 확인 (IP 인증서는 6일짜리라 자주 갱신) — 인증·허용 목록 없이 webroot 에서
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # (선택) IP 허용 목록 — 파일이 비어 있으면 모두 허용
        include /etc/nginx/conf.d/allow.conf;

        auth_basic           "task-spec";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Basic 인증 헤더는 앱으로 넘기지 않는다
        proxy_set_header Authorization "";

        # 헬스체크는 인증 없이 (모니터링용) — 키·원문은 응답에 없음
        location = /healthz {
            auth_basic off;
            proxy_pass http://task_api;
        }

        # 진행 상황 SSE — 버퍼링 끄고 길게 연다
        location ~ ^/runs/[^/]+/events$ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://task_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            add_header X-Accel-Buffering no;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://task_api;
            # 공통 과제 생성처럼 긴 요청 (LLM_TIMEOUT_SECONDS 300 + 여유)
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
