# CORS 응답 헤더 — 허용 origin 은 nginx.conf 의 map $cors_origin (run.sh 가 .allow_list 로 만든다).
# 목록에 없는 origin 이면 $cors_origin 이 비어 Access-Control-Allow-Origin 이 나가지 않는다 → 브라우저가 막는다.
# location 에 add_header 가 하나라도 있으면 server 의 add_header 를 물려받지 않으므로 그런 location 에도 include 한다.
add_header Access-Control-Allow-Origin      $cors_origin always;
add_header Access-Control-Allow-Credentials true always;
add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Last-Event-ID" always;
add_header Access-Control-Max-Age           600 always;
add_header Vary                             Origin always;
