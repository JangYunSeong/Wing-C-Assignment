# 템플릿 backend/java-spring-boot3-jpa v1 (docs/design/starter-templates.md §3, spec-to-code.md §4.1)
# 근거: 배송 감사 손 예시(Java, git 밖 data/feature_starters/delivery-audit) — 뼈대·하네스를 과제와 무관하게 일반화.
# 이 파일은 P1 내부용이다 — 응시용 이미지에는 project/ 만 들어간다.
template_id: backend/java-spring-boot3-jpa
version: 1
stack:
  language: java
  language_version: "17"
  framework: spring-boot
  framework_version: "3.3.5"
  build_tool: gradle
  build_tool_version: "8.10.2"
interfaces: [http]
workspace: /workspace
commands:
  build: ./gradlew --offline -q build -x test
  test: ./gradlew --offline test
  hidden_test: ./gradlew --offline test --tests 'com.example.service.grading.*'
  run: ./gradlew --offline bootRun
  test_compile: ./gradlew --offline -q compileTestJava

naming:
  # 경로 변수는 camelCase 허용 ({robotId}) — 2026-11-07 종이 단계: {id} 만 맞던 규칙이 다른 백엔드 명세의 {robotId} 를 거부
  path: '^/[a-z0-9/\-]*(?:\{[A-Za-z][A-Za-z0-9]*\}[a-z0-9/\-]*)*$'
  entity: '^[A-Z][A-Za-z0-9]*$'
  field: '^[a-z][A-Za-z0-9]*$'
  # 엔티티 → 테이블: Spring Boot JPA 기본 (CamelCaseToUnderscoresNamingStrategy, 소문자) — DeliveryAuditLog → delivery_audit_log.
  # 계약(README)에 테이블 이름이 보이고, 시작 코드 선언·숨은 테스트의 SQL 정규식을 이 이름과 대조한다 (starter/tables.py).
  table:
    style: snake
    # 테이블 이름으로 쓰면 따옴표 없이는 실패하는 SQL 예약어 (SQL 표준·PostgreSQL·H2 에서 흔히 걸리는 것) → 복수형 (order → orders)
    reserved: [order, user, group, select, table, from, where, check, column, default, values, value, key,
               limit, offset, union, join, references, primary, foreign, constraint, end, case, all, any,
               year, month, day]
    declare_patterns:
      - '\bcreate\s+table\s+(?:if\s+not\s+exists\s+)?[`"]?(\w+)'
      - '@Table\s*\([^)]*\bname\s*=\s*"(\w+)"'
    # 외래 키 선언 — 계약 엔티티의 foreign_keys 에 없으면 시작 코드 재요청 (없는 대상의 요청도 기록하는 테이블에 걸면 기록이 거부됨)
    fk_patterns:
      - '\bforeign\s+key\s*\(\s*[`"]?(\w+)'
      - '@(ManyToOne|OneToOne)\b'

# 오버레이 kind 별로 쓸 수 있는 경로 (프로젝트 기준 상대 경로, glob). ref = ref_naive·ref_accepted.
fill_slots:
  starter:
    - src/main/java/com/example/service/**/*.java
    - src/main/resources/application.yml
    - src/main/resources/schema.sql
    - src/main/resources/data.sql
    - src/test/java/com/example/service/**/*.java
    - docs/**
  public_test:
    - src/test/java/com/example/service/publictests/**/*.java
  hidden:
    - src/test/java/com/example/service/grading/cases/**/*.java
    - src/test/resources/grader-params.properties
  ref:
    - src/main/java/com/example/service/**/*.java
    - src/main/resources/application.yml
    - src/main/resources/schema.sql
    - src/main/resources/data.sql
# Spring sql.init (mode: always) 은 주석을 걷어낸 스크립트가 비면 부팅에 실패한다 — 오버레이가 이 파일을 실행할 문장 없이 쓰면
# 코드가 noop 을 붙인다 (starter/init_scripts.py). 2026-11-07 알파 테스트: 시드 0행 → data.sql 주석뿐 → 시작 코드 boot_error 2회.
init_scripts:
  paths: [src/main/resources/schema.sql, src/main/resources/data.sql]
  noop: "SELECT 1;"
# 설정 파일은 덮어쓰지 않고 바탕(템플릿 → 시작 코드) 위에 키 단위로 합친다 (starter/config_merge.py). 잠긴 키는 늘 바탕 값 —
# 바탕에 없으면 지운다(Spring Boot 기본값: 컨텍스트마다 다른 이름의 메모리 DB). 2026-11-08 알파: 참조 구현 4개가 application.yml 을
# 통째로 다시 써 ddl-auto·sql.init 을 지우거나(시드가 사라져 404) DB 주소를 고정(schema.sql 두 번 실행, 기동 실패).
config_merge:
  paths: [src/main/resources/application.yml]
  locked_keys: [spring.datasource.url, spring.jpa.hibernate.ddl-auto, spring.sql.init.mode]
# 시드 SQL 은 코드가 계약 시드(행 수·id 범위별 처음 값)에서 쓴다 (starter/seed_sql.py) — 생성기가 쓴 data.sql 은 렌더본으로 바뀐다.
# 2026-11-07 알파 3×3: 시작 코드가 수백 행 시드를 "같은 방식으로" 주석으로 생략(3/7), GENERATED ALWAYS 에 id 직접 입력 H2 오류.
seed_sql:
  path: src/main/resources/data.sql
  schema_path: src/main/resources/schema.sql
  column_style: snake
  restart: "ALTER TABLE {table} ALTER COLUMN id RESTART WITH {next};"
  # H2 는 identity 절이 제약(PRIMARY KEY)보다 앞 — `id BIGINT PRIMARY KEY GENERATED …` 는 문법 오류 (2026-11-08 H2 2.2.224 로 확인)
  id_column: "id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY"
# 숨은 테스트 도우미 — 코드가 이 과제의 계약에서 만든다 (starter/hidden_helpers.py). 숨은 케이스는 이 클래스를 상속해 id 범위·계약 API·본문 파싱·동시 요청을 쓴다.
# 2026-11-08 재평가: 숨은 테스트 컴파일 오류 대부분이 Duration.ofSeconds(REQUEST_TIMEOUT) — 검사 대신 어긋날 수 없게.
hidden_helper:
  path: src/test/java/com/example/service/grading/cases/ContractCase.java
  package: com.example.service.grading.cases
  class_name: ContractCase
# 템플릿 클래스패스에 없는 패키지 (build.gradle 은 starter-web·data-jpa·test 뿐) — 시작 코드·참조 구현이 import 하면 재요청.
unavailable_imports:
  - '^\s*import\s+(?:static\s+)?lombok\b'  # Lombok 은 템플릿에 없다 (검증 스타터는 2026-11-08 템플릿에 넣음)
  - '^\s*import\s+(?:static\s+)?org\.hibernate\.validator\b'
# 공개 테스트 도우미 — 같은 렌더러로 공개 테스트 몫 행만 (동시 요청·오류 주입 없음). 공개 테스트는 채점용 이미지에만 (지원자에게 주지 않음 —
# 2026-11-08 기본값, spec-to-code §4.3). 같은 폴더에 코드가 저장 확인 테스트(PersistenceCheckTest)도 쓴다.
public_helper:
  path: src/test/java/com/example/service/publictests/PublicCase.java
  package: com.example.service.publictests
  class_name: PublicCase
# 시작 코드의 기존 기능 테스트가 HTTP API 를 부르는 곳 — MockMvc 요청 빌더 (그룹 method, 매치 끝 = 경로 인자). 새 API(계약 existing 아님,
# 명세에 경로로 나오지 않음)를 부르면 시작 코드가 새 기능을 구현한 것 (static_check._starter_new_api_tests).
# 2026-11-07 알파 4회차: 배송 감사 시작 코드가 감사 기록 조회 API 와 그 '기존 기능 테스트'까지 써서 시작 코드만으로 hc1 통과.
starter_test_calls:
  - '(?<!\w)(?P<method>get|post|put|patch|delete)\(\s*(?=")'
# 어느 오버레이도 덮어쓸 수 없다.
locked:
  - build.gradle
  - settings.gradle
  - gradlew
  - gradlew.bat
  - gradle/wrapper/gradle-wrapper.jar
  - gradle/wrapper/gradle-wrapper.properties
  - src/main/java/com/example/service/ServiceApplication.java
# hidden 외의 오버레이는 쓸 수 없다 (채점 하네스·케이스 자리).
reserved:
  - src/test/java/com/example/service/grading/**
  - src/test/resources/grader-params.properties
# 채점용 이미지 조립 때 hidden/ 을 둘 곳 — harness·selftest 는 잠긴 템플릿 파일, cases·params 는 과제 오버레이
hidden_layout:
  harness: src/test/java/com/example/service/grading
  selftest: src/test/java/com/example/service/grading/selftest
  cases: src/test/java/com/example/service/grading/cases
  params: src/test/resources/grader-params.properties
limits:
  max_files: 60
  max_file_bytes: 100000
  max_total_bytes: 600000
  allow_dependency_changes: false
# 이미지 층 (starter-templates.md §6.1 [확정: 2026-11-07 사용자]) — 템플릿·응시용 이미지에는 project/ 와 의존성 캐시만.
# hidden/ 과 manifest.yaml 은 채점용 레이어에서만 더한다. 응시용 레이어 검사의 금지 경로는 starter/templates.py 가 계산한다.
image:
  template_layer: [project/]
  grader_only: [hidden/, manifest.yaml, README.tpl.md]
  grader_only_dependencies: []   # 하네스는 spring-boot-starter-test 안의 것만 쓴다 (응시용 의존성과 같음)
# 숨은 테스트 케이스 정적 검사 (spec-to-code §6) — 케이스는 공개 계약(HTTP)으로만 판정한다
hidden_rules:
  forbidden_imports:
    - '^\s*import\s+(?:static\s+)?com\.example\.service\.(?!grading\b)'
  reason_patterns:
    - 'Reasons\.(?:as|tag)\(\s*"([a-z0-9_]+)"'
  # 단언 사유 표시 (코드, 문구) — 한 케이스 파일에 같은 쌍이 둘이면 사유가 잘못 붙었을 수 있어 다시 쓰게 한다
  reason_labels:
    - 'Reasons\.as\(\s*"([a-z0-9_]+)"\s*,\s*"((?:[^"\\]|\\.)*)"'
  # 오류 주입 정규식(failStatements·failCommitAfter 에 넣는 Pattern.compile 문자열)이 가리키는 테이블 — 계약 테이블만.
  # 다른 문자열(assert 메시지 "update failed" 등)은 보지 않는다.
  string_literal: 'Pattern\.compile\(\s*"((?:[^"\\\n]|\\.)*)"'
  table_refs:
    - '^(?:\^|\(\?[a-z]+\))*(?:\s|\\\\s[*+]?)*(?:update|insert(?:\s|\\\\s[*+]?)+into|delete(?:\s|\\\\s[*+]?)+from)(?:\s|\\\\s[*+]?)+(?:\\"|[`"])?(\w+)'
  http_calls:
    - '(?<![\w.])send\(\s*"(?P<method>[A-Z]+)"\s*,\s*'
    - '(?<![\w.])get\(\s*(?=")'
  # 응답 JSON Map 값을 단언에 그대로 넣는 곳 (그룹 1 = 필드) — 계약에서 정수 형식인 필드면 다시 쓰게 한다 (static_check._raw_number_asserts).
  # 2026-11-07 알파 테스트: assertThat(log.get("transactionId")).isEqualTo(txId) → Integer 105 ≠ 105L 로 흔한 구현·허용 구현 모두 실패.
  # 변수(+ 인자에 괄호 없는 메서드 호출 사슬) 바로 뒤 .get("필드") 만 — 캐스트한 꼴 `assertThat(((Number)log.get("id")).longValue())` 은 맞지 않는다.
  # (2026-11-07 알파 3회차: 처음 정규식이 공백 없는 캐스트를 잡아 올바른 숨은 테스트를 재요청·실패시킴)
  # 사유를 붙이면 안 되는 단언 — 모든 실패를 세는 Burst.wrong(...) (운영 조건 사유는 Burst.failures(...) 에)
  reason_not_on: ['\bBurst\.wrong\(']
  raw_number_asserts:
    - 'assertThat\(\s*\w+(?:\.\w+\([^()"]*\))*\.get\(\s*"(\w+)"\s*\)\s*\)'

# 버스트 케이스가 요청마다 다른 시드 행을 쓰려면 필요한 행 수 = 이 조절값들의 곱 (HiddenCase.data[].burst, spec-to-code §10-16)
burst_rows: [concurrency, bursts]

# 하네스 조절값 — HiddenPlan.harness 의 키. visible = 명세 1단계 자료·구체 답에서 같은 값이 보여야 함 (spec-to-code §3.3).
# spec_patterns 그룹 1 = 값. config_keys 는 GraderSupport.OPERATING 과 같아야 한다 (tests/starter/test_templates.py).
harness_params:
  - name: pool_size
    kind: int
    description: 운영 DB 연결 풀 최대 크기 — 채점 때 Spring 속성으로 넣는다
    minimum: 1
    maximum: 500
    required: true
    visible: true
    spec_patterns:
      - 'maximum-pool-size\s*:\s*(\d+)'
      - 'maximumPoolSize\s*[=:]\s*(\d+)'
      - 'hikari\.maximum-pool-size\s*=\s*(\d+)'
      - '(?:DB|데이터베이스)\s*연결\s*(?:최대\s*(?:값|크기|수)?|수)\s*(?:은|는|:|=)?\s*(\d+)'
      - '최대\s*연결\s*수\s*(?:은|는|:|=)?\s*(\d+)'
    spec_columns: ['(?:maximum_)?pool_size', 'max_pool(?:_size)?']
    config_keys: [spring.datasource.hikari.maximum-pool-size]
  - name: connection_timeout_ms
    kind: int
    description: DB 연결 획득 대기 한도 (ms)
    minimum: 100
    maximum: 60000
    required: false
    visible: true
    spec_patterns:
      - 'connection-timeout\s*:\s*(\d+)'
      - 'connectionTimeout\s*[=:]\s*(\d+)'
      - '연결\s*획득\s*대기\D{0,8}?(\d+)\s*ms'
    config_keys: [spring.datasource.hikari.connection-timeout]
  - name: server_threads
    kind: int
    description: 요청 처리 스레드 최대 수
    minimum: 1
    maximum: 1000
    required: false
    visible: true
    spec_patterns:
      - 'threads\s*:\s*max\s*:\s*(\d+)'
      - 'tomcat\.threads\.max\s*[=:]\s*(\d+)'
      - 'maxThreads\s*[=:]\s*(\d+)'
      - '요청\s*처리\s*스레드\s*(?:수\s*)?(?:은|는|:|=)?\s*(\d+)'
    config_keys: [server.tomcat.threads.max]
  - name: concurrency
    kind: int
    description: 버스트 한 번의 동시 요청 수 (운영 피크와 같은 값)
    minimum: 1
    maximum: 500
    required: true
    visible: true
    spec_patterns:
      - '동시\s*(?:요청|처리)\s*(?:수\s*)?(?:은|는|:|=)?\s*(?:최대\s*)?([\d,]+)\s*건'
      - 'activeRequests\s*=\s*(\d+)'
      - 'in[-_ ]?flight\s*[=:]?\s*(\d+)'
      - 'concurrent(?:_requests)?\s*[=:]\s*(\d+)'
    spec_columns: ['in_?flight(?:_requests)?', 'concurrent(?:_requests)?', 'active_?requests', '동시\s*요청(?:\s*수)?']
  - name: bursts
    kind: int
    description: 버스트 반복 수 (기본 3)
    minimum: 1
    maximum: 10
    required: false
    default: 3  # 버스트 케이스인데 HiddenPlan 에 없으면 코드가 넣는다 (지원자에게 안 보이는 값)
  - name: query_delay_ms
    kind: int
    description: SQL 문마다 더하는 지연 (기본 20, 공개 지표의 요청 시간과 비슷하게)
    minimum: 0
    maximum: 200
    required: false
  - name: request_timeout_s
    kind: int
    description: 채점 클라이언트의 요청 하나 시간 한도 (기본 = max(30, connection_timeout_ms × 2 / 1000 + 5))
    minimum: 1
    maximum: 120
    required: false
  - name: await_timeout_ms
    kind: int
    description: 비동기 설계를 위해 결과를 기다리는 최대 시간 (기본 5000)
    minimum: 0
    maximum: 30000
    required: false

# 의도한 실패 사유 — HiddenPlan.cases[].intended_reason 은 이 코드만. 앱 로그 패턴 또는 케이스가 붙인 [reason:<code>] 로 대조.
failure_reasons:
  - code: pool_acquire_timeout
    description: DB 연결 풀에서 연결을 얻지 못해 시간 초과
    log_patterns:
      - 'Connection is not available, request timed out after'
      - 'HikariPool-\d+ - Connection is not available'
      - 'CannotCreateTransactionException'
      - '\[reason:pool_acquire_timeout\]'
    requires: ['\bpeak\(', 'Burst\.(?:rounds|fire)\(']  # 운영 피크를 실제로 재현해야 이 사유가 나온다
    how: 운영 피크를 peak(…) 로 재현한다 (동시 요청 수만큼씩 버스트 수만큼, 요청마다 다른 행). 사유는 Burst.failures(…) 단언에
  - code: request_timeout
    description: 채점 클라이언트 요청이 시간 한도 안에 끝나지 않음
    log_patterns: ['HttpTimeoutException', '\[reason:request_timeout\]']
    how: 케이스 data 가 버스트면 동시 요청(peak(…))으로, 아니면 지연 없이 같은 요청을 한 번 보내 데운 뒤 지연을 주입(GraderJdbcHarness.queryDelayMs)하고 Burst.fire(1, …) 로 한 번 보낸다 (버스트가 아닌 케이스에 peak 를 쓰면 올바른 구현도 동시 부하로 시간 초과). 사유는 Burst.failures(…) 단언에
  - code: server_error
    description: 기대한 응답 대신 5xx
    log_patterns: ['\[reason:server_error\]']
    how: 규칙을 통과하는 요청(NEXT_OK_…)을 보내고 5xx 가 없는지 본다. 사유는 상태 코드 단언에
  - code: rollback_left_success
    description: 롤백된 변경에 성공 기록이 남음
    log_patterns: ['\[reason:rollback_left_success\]']
    # 규칙을 통과한 변경을 저장 단계에서 실패시켜야 롤백이 생긴다 (거절되는 전이는 롤백될 변경이 없음 — 2026-11-08 검토 4/5)
    requires: ['GraderJdbcHarness\.fail(?:CommitAfter|Statements)\s*=', '\binject(?:Commit|Statement)Failure\s*\(']
    how: 규칙을 통과하는 요청(NEXT_OK_…)에 injectCommitFailure("update", TABLE_<대상>) 로 저장 단계 실패를 주입한다 (finally 에서 GraderJdbcHarness.reset()). 거절되는 전이는 저장 전에 끝나 롤백될 변경이 없다. 사유는 그 요청의 SUCCESS 기록 없음 단언에
  - code: record_missing
    description: 요청에 대한 기록이 없음
    log_patterns: ['\[reason:record_missing\]']
    how: 요청마다 계약의 조회 API 로 기록을 읽어 hasSize(1). 사유는 그 단언에
  - code: record_mismatch
    description: 기록 결과가 응답과 맞지 않음
    log_patterns: ['\[reason:record_mismatch\]']
    how: 기록의 대상 id·결과가 그 요청의 응답과 같은지 비교한다. 사유는 그 비교 단언에
  - code: lost_update
    description: 같은 행에 동시에 들어온 변경 일부가 사라짐 (남은 값이 성공 응답 합과 맞지 않음)
    log_patterns: ['\[reason:lost_update\]']
    requires: ['Burst\.(?:fire|rounds)\(']  # 같은 행에 실제로 동시에 보내야 이 사유가 나온다
    how: 같은 행 하나에 바꾸는 요청을 Burst.fire(…) 로 동시에 보내고(요청마다 같은 id), 끝난 뒤 계약의 조회 API 로 읽은 값이 처음 값과 성공 응답(200) 수로 계산한 값과 같은지 본다. 사유는 그 값 비교 단언에 (5xx 는 server_error 로 따로)
  - code: duplicate_record
    description: 같은 요청을 다시(또는 동시에) 보냈는데 처리가 두 번 일어남
    log_patterns: ['\[reason:duplicate_record\]']
    how: 같은 요청 키·같은 본문으로 같은 요청을 차례로 두 번, 그리고 Burst.fire(…) 로 동시에 보낸 뒤 계약의 조회 API 로 기록이 한 건인지(hasSize(1))·값이 한 번만 바뀌었는지 본다. 사유는 그 건수·값 단언에
  - code: injected_failure_ignored
    description: 주입한 DB 오류에도 성공 응답
    log_patterns: ['\[reason:injected_failure_ignored\]']
    how: 규칙을 통과하는 요청(NEXT_OK_…)에 injectStatementFailure("update", TABLE_<대상>) 로 저장 SQL 을 실패시키고 성공 응답(200)이 없는지 본다 (finally 에서 GraderJdbcHarness.reset()). 사유는 상태 코드 단언에

# 허용 설계가 이 스택에서 성립하는 조건 (spec-to-code §4.2) — 배송 감사 손 예시 실험(REPORT §5·§6)에서.
# 흔한 구현이 재료 설명대로 실제로 동작하게 하는 스택 사실 (gen_naive 구현 목표에 붙음 — 깨지는 이유는 쓰지 않는다).
# 2026-11-07 알파 5회차: 흔한 구현이 REQUIRES_NEW 메서드를 같은 클래스 안에서 불러 전파 옵션이 무시됨 → 숨은 케이스를 두 번 통과.
naive_conditions:
  - 트랜잭션 전파 옵션(@Transactional(propagation = …))은 다른 빈의 public 메서드를 부를 때만 적용된다 — 같은 클래스 안에서 부르면 무시된다. 설명이 별도 트랜잭션이면 그 메서드를 다른 빈(서비스)에 둔다.
stack_conditions:
  - 바깥 @Transactional 안에서 REQUIRES_NEW 로 다른 트랜잭션을 열면 요청 하나가 연결을 둘 쥔다. 연결 하나로 끝내려면 기록을 바깥 트랜잭션이 끝난 뒤 트랜잭션 밖에서 쓴다.
  - spring.jpa.open-in-view 가 기본값(켬)이면 트랜잭션이 끝나도 요청 동안 연결을 쥔다. 트랜잭션 뒤 기록을 별도 JdbcTemplate·DataSource 로 쓰면 두 번째 연결이 된다 — 같은 EntityManager(같은 연결 재사용)로 쓰거나 open-in-view 를 끈다.
  - TransactionSynchronization.afterCompletion·동기 @TransactionalEventListener 는 끝난 트랜잭션의 연결을 아직 쥔 채로 돈다. 여기서 REQUIRES_NEW 로 쓰면 두 번째 연결이다 — 후처리 변형은 다른 스레드(@Async·아웃박스 폴러)여야 한다.
  - JPA 는 바뀐 엔티티의 UPDATE 를 커밋 때 실행할 수 있어, 그 오류는 @Transactional 메서드 안의 catch 에 잡히지 않고 메서드가 끝난 뒤(프록시의 커밋)에서 난다. 메서드 안에서 쓴 실패 기록도 함께 롤백된다 — 실패 기록은 트랜잭션 메서드를 부른 쪽(트랜잭션 밖)에서 예외를 잡은 뒤 쓴다.
  # 2026-11-10: 예전 문장('풀을 산정해 늘리는 설계는 코드(데이터소스 설정)에서 정해야 채점에 반영된다')이 허용 구현에게 채점 운영 값 우회를 가르쳤다
  - 운영 풀 크기·연결 대기 한도·요청 스레드 수는 채점 환경이 정한다 — application.yml 값은 덮이고, 코드로 데이터소스·풀을 만들거나 바꾸면 정적 검사가 막는다. 숨은 요구는 연결을 쓰는 방식(트랜잭션 경계·기록 시점)으로 푼다.
