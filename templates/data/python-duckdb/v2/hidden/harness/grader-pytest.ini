# 채점 전용 pytest 설정 — 지원자 설정(pyproject)은 쓰지 않는다. 저장소 루트에서:
#   python -m pytest -c grading/harness/grader-pytest.ini grading/selftest grading/cases public_tests
# (없는 폴더는 빼고 넘긴다). rootdir = 이 파일의 폴더 — pythonpath 는 grading/ 과 저장소 루트.
[pytest]
pythonpath = .. ../..
addopts = --import-mode=importlib -p no:cacheprovider -q
python_files = test_*.py
junit_family = xunit1
