# 재료 pub:data.eng:rate-gap-orders-dropped 의 숨은 안내 (#256 넷째 데이터 재료, 2026-11-24 — 평가 전용, 손 구현 없음).
# 예시 코드(hidden_example)는 확인할 손 구현이 없어 두지 않았다. 지킬 것은 다른 데이터 재료 안내와 같다.
incident_id: pub:data.eng:rate-gap-orders-dropped
failure_reasons:
  - code: order_dropped_no_rate
    description: 환율 파일에 그 날짜 행이 없는 날의 주문이 요약에서 빠지거나 금액이 줄어듦 (주문 날짜와 같은 날짜의 환율로만 조인)
    log_patterns: ['\[reason:order_dropped_no_rate\]']
    how: 환율 행이 있는 날의 주문으로 실행해 요약이 정의대로인 것을 (사유 없이) 확인한 뒤, 같은 통화의 앞선 고시는 있고 그 날짜 행만 없는 다음 날짜의 주문을 그 날짜 폴더에 넣고 그 날짜로 실행 (앞선 고시가 전혀 없는 장면은 만들지 않고, 환율 파일에 실행 날짜보다 뒤 행을 두지 않는다). 사유는 "실행 성공"과 "그 날짜 요약의 건수·원화 합이 직전 고시 환율로 바꾼 값인지" 단언 모두에
hidden_rules:
  - 이 재료의 숨은 요구 장면은 환율 파일에 그 날짜 행이 없는 날의 주문이다. 동작 확인 실행에는 환율 파일에 그 날짜 행이 있는 날의 주문만 둔다.
  - 환율 행이 없는 날 케이스는 환율 파일에 그 날짜보다 앞선 같은 통화 고시를 하나 이상 둔다. 앞선 고시가 전혀 없는 장면(실행이 실패해야 하는 규칙)은 공개 계약의 규칙이라 숨은 케이스로 만들지 않는다.
  - 환율 행이 없는 날의 실행이 실패하는 것(종료 코드 1)도 이 사유의 실패다 — 그 실행의 성공 단언에도 사유를 붙인다 (같은 날짜 조인 구현은 환율을 못 찾아 실패로 끝나기도 한다).
  - 주문은 그 주문 날짜 폴더에 둔다 (ordered_at 날짜 = 폴더 날짜). 환율 파일에는 실행 날짜보다 뒤 날짜의 행을 두지 않는다.
  - 기대 값은 amount × (같은 통화의 주문 날짜 이전 가장 최근 고시 환율) 의 정수 합으로 테스트 안에서 계산한다 — 통화가 여럿이면 통화마다 따로 찾는다.
  - 요약은 모든 날짜 파티션을 읽어 비교한다 — 파일 이름·개수는 재지 않는다.
accepted_conditions:
  - 주문마다 같은 통화의 주문 날짜 이전(같은 날 포함) 가장 최근 고시 환율을 붙인다 — 같은 날짜로만 조인하면 환율 행이 없는 날의 주문이 빠진다.
  - 환율이 붙지 않은 주문이 있으면 조용히 빼지 않고 실행을 실패시킨다.
public_rules:
  - 공개 테스트의 주문은 환율 파일에 그 날짜 행이 있는 날짜에만 둔다.
  - 공개 테스트는 날짜 순서대로 날짜마다 한 번씩 실행한다.
