# 재료 pub:data.eng:dump-deleted-still-current 의 숨은 안내 (#256 셋째 데이터 재료, 2026-11-24 — 평가 전용, 손 구현 없음).
# 예시 코드(hidden_example)는 확인할 손 구현이 없어 두지 않았다. 지킬 것은 다른 데이터 재료 안내와 같다.
incident_id: pub:data.eng:dump-deleted-still-current
failure_reasons:
  - code: removed_still_current
    description: 그날 목록에 없는 가맹점의 현재 버전이 닫히지 않음 (오늘 목록에 있는 행만 비교)
    log_patterns: ['\[reason:removed_still_current\]']
    how: 첫 날짜 목록으로 실행해 이력이 정의대로인 것을 (사유 없이) 확인한 뒤, 다음 날짜 목록에서 가맹점 하나를 빼고(나머지 값은 그대로) 실행. 사유는 "그 가맹점의 버전이 다음 날짜로 닫혔고 현재 가맹점 집합이 다음 날짜 목록과 같은지" 단언에
  - code: reappeared_not_reopened
    description: 목록에서 빠졌다가 다시 나타난 가맹점에 새 현재 버전이 열리지 않음
    log_patterns: ['\[reason:reappeared_not_reopened\]']
    how: 가맹점 하나를 뺀 목록으로 실행한 다음 날짜에 그 가맹점을 다시 넣어 실행. 사유는 "그 가맹점에 다시 나타난 날짜로 시작하는 현재 버전이 있고 빠진 날짜로 닫힌 지난 버전이 남았는지" 단언에. 빠진 날짜 실행 뒤에는 그 가맹점을 단언하지 않는다
hidden_rules:
  - 이 재료의 숨은 요구 장면은 (가) 다음 날짜 목록에서 가맹점이 빠짐, (나) 빠졌던 가맹점이 다시 나타남이다. 동작 확인 실행에는 가맹점을 빼지 않는다 — 가맹점이 새로 생기거나 값만 바뀌는 목록으로 확인한다.
  - 빠짐 케이스는 같은 실행에서 다른 가맹점의 값을 바꾸지 않는다 — 값 바뀜을 섞으면 다른 이유로 떨어지는 구현이 생긴다.
  - 다시 나타남 케이스는 빠진 날짜 실행 뒤 그 가맹점을 단언하지 않고, 다시 나타난 날짜 실행 뒤에만 단언한다 — 빠짐 사유와 섞이지 않게.
  - 날짜마다 그날 원천 전체 목록을 쓴다 (일부만 쓰지 않는다). 입력은 받은 날짜 순서대로, 날짜 폴더는 그 날짜를 실행하기 직전에 쓴다.
  - 이력은 계약의 위치(이력 폴더의 parquet 전체)를 읽어 가맹점·버전 단위로 비교한다 — 행 순서·파일 이름·개수는 재지 않는다.
accepted_conditions:
  - 현재 버전 전체와 그날 목록을 가맹점 번호로 맞대어, 그날 목록에 없는 가맹점의 현재 버전을 그 날짜로 닫는다 — 오늘 목록에서 출발하는 조인은 빠진 가맹점을 보지 못한다.
  - 빠졌던 가맹점이 다시 나타나면 지난 버전을 되살리지 않고 새 버전을 연다. 지난 버전은 지우지 않는다.
public_rules:
  - 공개 테스트의 날짜별 목록에서는 가맹점을 빼지 않는다 — 가맹점은 새로 생기거나 값만 바뀐다.
  - 공개 테스트는 날짜 순서대로 날짜마다 한 번씩 실행한다.
