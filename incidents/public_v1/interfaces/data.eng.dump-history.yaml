# 재료 pub:data.eng:dump-deleted-still-current 의 공개 인터페이스 (#256 셋째 데이터 재료, 2026-11-24 — 평가 전용, 손 구현 없음).
# 코드가 계약에 채운다 (starter/interface.fit_interface). 지킬 것 (다른 데이터 재료 인터페이스와 같음):
# - 설명 글에 재료의 trigger_terms·leak_terms·stage2_cause_terms·hidden_terms·avoid_terms 를 쓰지 않는다 (공개 계약에 그대로 나간다).
# - 그날 목록에 없는 가맹점을 어떻게 다루는지는 공개 글로 정하지 않는다 — 그것이 숨은 요구다. 현재 버전의 정의(가장 최근 목록의 값)만 둔다.
incident_id: pub:data.eng:dump-deleted-still-current
commands:
  - endpoint_id: e1
    path: pipeline/build_history.py
    summary: 원천의 날짜별 가맹점 목록으로 가맹점 변경 이력을 갱신하는 배치 — 스케줄러가 매일 실행 날짜로 부른다
    options:
      - {name: date, type: date, constraints: "실행 날짜 (YYYY-MM-DD) — 스케줄러가 매일 그날 날짜로 부른다"}
      - {name: raw, type: string, constraints: "목록 폴더 — 읽기만 한다"}
      - {name: out, type: string, constraints: "이력 폴더 — 작업이 쓰는 파일은 모두 이 아래에 둔다"}
    responses:
      - {status: 0, description: "성공 — 이력을 갱신함"}
      - {status: 1, description: "실패 — 오류 내용을 표준 오류에 출력함"}
files:
  - fixture_id: f1
    role: input
    path: "{raw}/{date}/*.csv"
    format: csv
    entity: StoreRecord
    summary: 날짜별 가맹점 목록 — 원천 시스템이 그날 내보낸 csv 파일
    content: >-
      csv, 머리글 한 줄 뒤 한 행에 StoreRecord 하나. 날짜 폴더 하나가 그날 원천의 가맹점 목록 전체다 (일부만 오지 않는다).
      실행 날짜 D 로 부를 때 D 폴더까지는 있고, D 보다 뒤 날짜 폴더는 아직 없다.
  - fixture_id: f2
    role: output
    path: "{out}/store_history/*.parquet"
    format: parquet
    entity: StoreVersion
    summary: 가맹점 변경 이력 — 정산·안내 발송이 수시로 읽는 parquet 파일
    content: >-
      parquet, 한 행에 StoreVersion 하나. 읽는 쪽은 store_history 아래 parquet 파일을 모두 읽고,
      이름이 _ 나 . 으로 시작하는 파일은 읽지 않는다. 파일 이름·개수는 자유다.
entities:
  - entity_id: m1
    name: StoreRecord
    fields:
      - {name: store_id, type: string, constraints: "가맹점 번호 — 가맹점마다 하나 (S + 세 자리)"}
      - {name: name, type: string, constraints: "가맹점 이름"}
      - {name: region, type: string, constraints: "지역"}
      - {name: fee_bp, type: integer, constraints: "수수료율 (bp, 정수)"}
  - entity_id: m2
    name: StoreVersion
    fields:
      - {name: store_id, type: string, constraints: "가맹점 번호"}
      - {name: name, type: string, constraints: "이 버전의 가맹점 이름"}
      - {name: region, type: string, constraints: "이 버전의 지역"}
      - {name: fee_bp, type: integer, constraints: "이 버전의 수수료율 (bp)"}
      - {name: valid_from, type: date, constraints: "이 버전이 시작된 날짜 — 이 값이 처음 목록에 나온 실행 날짜 (YYYY-MM-DD)"}
      - {name: valid_to, type: "date | null", required: false, constraints: "이 버전이 끝난 날짜 (YYYY-MM-DD) — 현재 버전이면 비어 있음"}
      - {name: is_current, type: boolean, constraints: "현재 버전이면 true — 가장 최근 실행 날짜 목록의 그 가맹점 값과 같은 버전"}
