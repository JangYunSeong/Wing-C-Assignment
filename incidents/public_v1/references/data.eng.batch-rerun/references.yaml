# 손 구현마다 `<name>/` 의 파일을 공용 폴더(`_shared/`) 위에 얹어 시작 코드 위에 놓는다 (같은 경로는 손 구현 것).
# 출처·확인 기록은 같은 폴더 README.md. 지킬 것:
# - 손 구현은 재료 인터페이스(interfaces/data.eng.batch-rerun.yaml)의 명령·옵션·입출력 위치·칸 이름대로 실행된다. 인터페이스를
#   고치면 손 구현을 다시 확인하고 interface_sha256 을 고친다 (starter.interface.interface_ref) — 다르면 관문이 꺼진다.
# - note 는 숨은 테스트 수리 요청·승인 화면에 나간다. 재료의 trigger_terms·leak_terms·stage2_cause_terms·hidden_terms 를 쓰지 않는다.
# - design 은 재료 feature.accepted_designs 순서 (1부터). 손 예시 REPORT 의 '허용 설계 N' 번호와 다르다 — 내용으로 맞췄다.
